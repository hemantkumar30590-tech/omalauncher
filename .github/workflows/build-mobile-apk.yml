name: build-mobile-apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ndk" >/dev/null
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build proot libraries
        run: ./scripts/fetch-proot.sh

      - name: Build FOSS release APK
        run: ./gradlew :app:assembleFossRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-foss-release
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
